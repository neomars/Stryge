name: Installer Godot
description: Télécharge Godot (éditeur Linux) et, si demandé, les modèles d'export Windows / Linux / macOS, en vérifiant les empreintes SHA-512 publiées par le projet Godot.

inputs:
  version:
    description: Version de Godot (sans le suffixe -stable)
    required: true
  templates:
    description: Installer aussi les modèles d'export (true / false)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Télécharger et installer
      shell: bash
      env:
        V: ${{ inputs.version }}
        WITH_TEMPLATES: ${{ inputs.templates }}
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot-builds/releases/download/${V}-stable"
        dl="$RUNNER_TEMP/godot-dl"
        mkdir -p "$dl" "$HOME/godot"
        cd "$dl"
        curl -fsSL --retry 3 -O "$base/SHA512-SUMS.txt"
        files=("Godot_v${V}-stable_linux.x86_64.zip")
        if [ "$WITH_TEMPLATES" = "true" ]; then files+=("Godot_v${V}-stable_export_templates.tpz"); fi
        for f in "${files[@]}"; do
          curl -fsSL --retry 3 -O "$base/$f"
          grep -F "  $f" SHA512-SUMS.txt | sha512sum -c -
        done
        unzip -q "Godot_v${V}-stable_linux.x86_64.zip" -d "$HOME/godot"
        sudo ln -sf "$HOME/godot/Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
        if [ "$WITH_TEMPLATES" = "true" ]; then
          tpl="$HOME/.local/share/godot/export_templates/${V}.stable"
          mkdir -p "$tpl"
          unzip -j -q "Godot_v${V}-stable_export_templates.tpz" \
            'templates/version.txt' 'templates/windows_release_x86_64.exe' \
            'templates/linux_release.x86_64' 'templates/macos.zip' -d "$tpl"
          ls -la "$tpl"
        fi
        godot --version
